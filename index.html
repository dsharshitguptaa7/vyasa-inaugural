<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Digital Inauguration of the VYASA-N Research Ecosystem, Chhatrapati Shahu Ji Maharaj University (CSJMU), Kanpur — Research & Development Cell.">
  <meta name="theme-color" content="#06090e">
  <title>VYASA-N | Research Ecosystem Inauguration — CSJM University</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient & Institutional Background Architecture -->
  <div class="inaugural-bg" aria-hidden="true">
    <div class="bg-gradient-base"></div>
    <div class="bg-radial-atmosphere"></div>
    <div class="bg-research-grid"></div>
    <div class="bg-architectural-accents">
      <div class="accent-circle accent-circle-1"></div>
      <div class="accent-circle accent-circle-2"></div>
      <div class="accent-axis-line accent-axis-h"></div>
      <div class="accent-axis-line accent-axis-v"></div>
    </div>
    <div class="particles-container" id="particlesContainer"></div>
  </div>

  <!-- Cinematic Transition FX Overlays -->
  <div class="cinematic-fx-overlay" id="cinematicFx" aria-hidden="true">
    <div class="reveal-shockwave" id="revealShockwave"></div>
    <div class="reveal-portal-flash" id="revealFlash"></div>
    <div class="reveal-whiteout" id="revealWhiteout"></div>
  </div>

  <!-- Main Inaugural Experience Container -->
  <main class="inaugural-container" id="inauguralContainer">

    <!-- Top Institutional Branding -->
    <header class="institutional-header">
      <div class="university-crest-wrapper">
        <img 
          src="assets/UNIVERSITY LOGO.png" 
          alt="Chhatrapati Shahu Ji Maharaj University, Kanpur" 
          class="university-logo"
          loading="eager"
        >
      </div>
      <div class="institutional-titles">
        <h1 class="university-title">CHHATRAPATI SHAHU JI MAHARAJ UNIVERSITY</h1>
        <p class="university-subtitle">KANPUR, UTTAR PRADESH</p>
        <div class="institutional-divider">
          <span class="divider-line"></span>
          <span class="divider-diamond">✦</span>
          <span class="divider-line"></span>
        </div>
        <p class="cell-designation">RESEARCH &amp; DEVELOPMENT CELL</p>
      </div>
    </header>

    <!-- Central VYASA-N Identity -->
    <section class="identity-section" aria-label="VYASA-N Research Ecosystem Identity">
      <div class="vyasa-logo-anchor">
        <div class="logo-ambient-halo" aria-hidden="true"></div>
        <div class="logo-ring-pulse" aria-hidden="true"></div>
        <img 
          src="assets/vyasa-logo.png" 
          alt="VYASA Research Ecosystem Emblem" 
          class="vyasa-logo" 
          id="vyasaLogo"
          loading="eager"
        >
      </div>

      <div class="identity-typography">
        <div class="ecosystem-title-wrapper">
          <h2 class="ecosystem-title">RESEARCH ECOSYSTEM</h2>
        </div>
        <p class="ecosystem-tagline">A Unified Research &amp; Governance Ecosystem</p>
        <p class="inaugural-microcopy">ENTERING THE RESEARCH ECOSYSTEM</p>
      </div>
    </section>

    <!-- Primary Inaugural Call to Action -->
    <footer class="inaugural-footer">
      <button 
        type="button" 
        class="cta-enter" 
        id="enterBtn" 
        aria-label="Enter VYASA-N Research Ecosystem"
      >
        <span class="cta-sheen" aria-hidden="true"></span>
        <span class="cta-inner">
          <span class="cta-text">ENTER ECOSYSTEM</span>
          <span class="cta-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"></path>
              <path d="M12 5l7 7-7 7"></path>
            </svg>
          </span>
        </span>
      </button>

      <div class="footer-metadata">
        <span class="metadata-item">OFFICIAL LAUNCH EDITION</span>
        <span class="metadata-separator">•</span>
        <span class="metadata-item">CSJMU INSTITUTIONAL GATEWAY</span>
      </div>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
